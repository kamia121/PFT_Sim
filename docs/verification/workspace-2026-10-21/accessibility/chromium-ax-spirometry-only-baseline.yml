- main:
  - heading "Simulated pulmonary function reports" [level=1]
  - paragraph: Read the report, write an interpretation on it, then check it against the key. The same values are shown under GLI-2012 and GLI Global so reclassification is visible.
  - paragraph:
    - strong: Educational use only.
    - text: Cases are simulated and uncalibrated. This tool does not provide patient-treatment recommendations and must not be used for clinical decisions.
