name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  browsers:
    uses: ./.github/workflows/browser-checks.yml
  deploy:
    needs: browsers
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # One allocation for verification, artifact upload and deployment.
    # Pin the image instead of relying on the moving ubuntu-latest alias.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Tries to switch Pages to the Actions source if it is off. This can fail with the default token;
          # the repository setting Settings > Pages > Source = GitHub Actions is then needed once.
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - name: Verify live assets and UI behavior
        run: timeout 360 node benchmarks/combined-ui-smoke.mjs
        env:
          PFT_BROWSER: chromium
          PFT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
